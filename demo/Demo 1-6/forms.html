<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS 181 Form Demo</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <main>
        <h1>CIS 181 Course Interest Form</h1>

        <p>
            This sample form shows how a website can collect information from
            visitors. Each form control has a label so users know what to enter.
        </p>

        <!--
            action="#" keeps this classroom demo on the same page.
            A real website would send the form data to a server for processing.
        -->
        <form action="#" method="post">
            <fieldset>
                <legend>Contact Information</legend>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </fieldset>

            <fieldset>
                <legend>Course Interests</legend>

                <label for="topic">Which topic interests you most?</label>
                <select id="topic" name="topic">
                    <option value="">Select a topic</option>
                    <option value="html">HTML Structure</option>
                    <option value="css">CSS Styling</option>
                    <option value="forms">Forms and User Input</option>
                    <option value="design">Website Design</option>
                </select>

                <p class="question">Which learning format do you prefer?</p>
                <div class="choice-group">
                    <input type="radio" id="in-person" name="format" value="in-person">
                    <label for="in-person">In person</label>

                    <input type="radio" id="online" name="format" value="online">
                    <label for="online">Online</label>
                </div>

                <label for="comments">Questions or Comments</label>
                <textarea id="comments" name="comments" rows="5"></textarea>

                <div class="choice-group">
                    <input type="checkbox" id="updates" name="updates">
                    <label for="updates">Send me course updates.</label>
                </div>
            </fieldset>

            <div class="buttons">
                <button type="submit">Submit Form</button>
                <button type="reset">Clear Form</button>
            </div>
        </form>
    </main>
</body>
</html>
